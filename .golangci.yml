# golangci-lint configuration for kanon.
#
# Derived from go.thesmos.sh/core's configuration. Production code imports
# the standard library and kanon itself. Tests and kanontest also import
# go.dokimi.dev/assert.

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  allow-parallel-runners: true
  tests: true
  relative-path-mode: gomod

output:
  show-stats: true
  sort-order:
    - linter
    - severity
    - file

linters:
  default: none
  enable:
    # Bugs & safety
    - copyloopvar
    - errcheck
    - errorlint
    - exhaustive
    - gosec
    - govet
    - nilerr
    - predeclared
    - staticcheck
    - unused
    - wastedassign
    # Modernization
    - modernize
    - unparam
    # Performance
    - gocritic
    - perfsprint
    - prealloc
    # Architecture & style
    - depguard
    - dupword
    - forbidigo
    - goconst
    - misspell
    - nilnil
    - revive
    - usestdlibvars
    - whitespace
    # Test hygiene
    - thelper
    - tparallel
    - paralleltest
    - usetesting

  settings:
    # depguard v2.2.1 compares an import with the one allow entry that
    # sorts just before it. $gostd expands to the directories of
    # GOROOT/src, among them "go", and go.thesmos.sh/kanon sorts between
    # "go" and "go/types". Every go/* import then fails unless "go/" is
    # listed on its own, as each rule below does.
    depguard:
      rules:
        main:
          list-mode: strict
          files:
            - "$all"
            - "!$test"
            - "!**/kanontest/**"
          allow:
            - $gostd
            - go/
            - go.thesmos.sh/kanon
        tests:
          list-mode: strict
          files:
            - "$test"
          allow:
            - $gostd
            - go/
            - go.dokimi.dev/assert
            - go.thesmos.sh/kanon
        kanontest:
          list-mode: strict
          files:
            - "**/kanontest/**"
          allow:
            - $gostd
            - go/
            - go.dokimi.dev/assert
            - go.thesmos.sh/kanon

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^panic$
          msg: "panic() is forbidden in library code; return errors explicitly."
        - pattern: ^fmt\.(Print|Printf|Println)$
          msg: "Library code does not print. The kanon command writes through its io.Writer."

    exhaustive:
      default-signifies-exhaustive: true
      check:
        - switch

    usetesting:
      context-background: true
      context-todo: true
      os-setenv: true
      os-mkdir-temp: true
      os-temp-dir: true

    gocritic:
      enabled-tags:
        - performance
        - diagnostic
      disabled-checks:
        - ifElseChain
        - commentedOutCode
      settings:
        hugeParam:
          sizeThreshold: 256
        rangeValCopy:
          sizeThreshold: 256

    revive:
      severity: error
      confidence: 0.1
      rules:
        - name: context-as-argument
        - name: var-naming
        - name: package-comments
        - name: receiver-naming
        - name: exported
          severity: warning
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: errorf
        - name: if-return
        - name: indent-error-flow
        - name: early-return
        - name: unexported-return
        - name: redundant-import-alias
        - name: range
        - name: empty-block
        - name: unnecessary-stmt
        - name: modifies-value-receiver
        - name: time-naming
        - name: unused-receiver

    govet:
      enable-all: true

    whitespace:
      multi-if: true
      multi-func: false

  exclusions:
    generated: lax
    paths:
      - docs
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # Packages wire, frame and batch and these files build and read the
      # wire format, and convert between integer widths on purpose: a field
      # number becomes the high bits of a uint64 tag, a signed value becomes
      # the uint64 of its varint, a length arrives as a uint64, the int
      # length of a frame becomes a uvarint and a read uvarint length becomes
      # an int, the int offsets and count of a batch become fixed-width
      # words and read words become ints, and the generator and the
      # reference encoder and decoder of kanontest size, write and read a
      # field number, a type number, a length and the bits of a number as the
      # uint64 varints and fixed-width words they encode as. The stream checks
      # of kanontest read the lengths of an encoding that decodes, and look up
      # a field by the number that a stream decoder returns. Every conversion
      # is bounded by a preceding check or is the conversion the wire format
      # defines. The wide samples of sample.go count up from 0 and convert the
      # count to every integer type of a sample. The text and the JSON of the
      # inspector read the bits of a fixed-width value as a signed integer,
      # which is one of the readings they print.
      - path: '^(wire/[a-z]+|frame/[a-z]+|batch/[a-z]+|internal/kanon/(emitter|decode|size)|kanontest/(encode|decode|sample|stream)|internal/inspect/(text|json))\.go$'
        linters: [gosec]
        text: "G115:"

      # wire.MustExact panics for a type that declares kanon.Exact and breaks
      # its guarantee. The generated code checks the guarantee without an
      # error path, and a wrong length would write a corrupt encoding without
      # an error, so the breach panics, as bufio.Reader panics for a reader
      # that returns a negative count.
      - path: '^wire/error\.go$'
        linters: [forbidigo]
        text: "use of `panic` forbidden"

      # The fixtures declare unexported fields that the generated code
      # leaves out of the encoding, which no code reads: leaving them out is
      # what the generated tests of such a fixture check.
      - path: '^internal/fixture/'
        linters: [unused]
        text: "field \\w+ is unused"

      # The loader runs `go list` in the package directory kanon was
      # given. The command is fixed, and the arguments are fixed flags,
      # the pattern "." and the import paths that go list itself reported
      # for the package.
      - path: '^internal/kanon/load\.go$'
        linters: [gosec]
        text: "G204:"

      # fieldalignment is noise outside hot-path structs.
      - linters: [govet]
        text: "fieldalignment:"

      # Test files state literal values inline; the value is the
      # assertion.
      - path: '_test\.go'
        linters: [goconst, gosec]

      # A test of an allocation ceiling calls assert.MaxAllocs, which
      # counts through testing.AllocsPerRun, and AllocsPerRun panics while
      # a parallel test runs. Such a test runs serially, and its name ends
      # in Allocs.
      - path: '_test\.go'
        linters: [paralleltest, tparallel]
        text: 'Test\w*Allocs\b'

      # A test that sets an environment variable of the process with
      # t.Setenv, which panics in a parallel test, runs serially, and its
      # name ends in Env.
      - path: '_test\.go'
        linters: [paralleltest, tparallel]
        text: 'Test\w*Env\b'

      # A test that runs the test binary again as a command runs its
      # processes serially, and its name ends in Process. Each process
      # writes the coverage meta-data file of the binary into the one
      # GOCOVERDIR under a temporary name that Go 1.27 makes from the time
      # in nanoseconds alone, so two processes that exit in the same
      # nanosecond collide, and one of them writes the failure to its
      # standard error.
      - path: '_test\.go'
        linters: [paralleltest, tparallel]
        text: 'Test\w*Process\b'

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(go.thesmos.sh/kanon)
      custom-order: true
    golines:
      max-len: 120
    gofumpt:
      extra:
        group-params: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: false

severity:
  default: error
