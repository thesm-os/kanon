name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate tag is on main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify tag commit is reachable from main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (commit ${GITHUB_SHA}) is not on main."
            exit 1
          fi

  reverify:
    name: Re-run CI gate
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-ergon
      - run: make bootstrap
      - run: make check

  goreleaser:
    name: Build, sign and publish
    needs: reverify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write       # cosign keyless signing and attestation OIDC
      attestations: write   # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v3
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # SLSA provenance for the archives and the raw binaries. Verify
      # with `gh attestation verify --owner thesm-os <file>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/**/kanon
            dist/**/kanon.exe
