# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# Release artefacts for the kanon command: one static binary per
# target, a source archive, a SHA-256 checksum list and a keyless
# cosign signature over that list. kanon is also installable with
# `go install go.thesmos.sh/kanon/cmd/kanon@<version>`, which needs
# none of this.
version: 2

project_name: kanon

before:
  hooks:
    - go vet ./...

builds:
  - id: kanon
    dir: .
    main: ./cmd/kanon
    binary: kanon
    env:
      - CGO_ENABLED=0
    # Anchors the binary timestamp to the commit, so two builds of one
    # tag are byte-identical.
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X go.thesmos.sh/kanon/internal/version.buildVersion={{.Version}}
      - -X go.thesmos.sh/kanon/internal/version.buildCommit={{.Commit}}
      - -X go.thesmos.sh/kanon/internal/version.buildDate={{.CommitDate}}

archives:
  - id: default
    formats: ['tar.gz']
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: ['zip']
    files:
      - LICENSE
      - NOTICE
      - README*

source:
  enabled: true
  name_template: '{{ .ProjectName }}_{{ .Version }}_source'

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless cosign signature over checksums.txt. Verify with:
#
#   cosign verify-blob \
#     --certificate-identity-regexp '^https://github.com/thesm-os/kanon/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --signature checksums.txt.sig --certificate checksums.txt.pem \
#     checksums.txt
#
# then check each archive against checksums.txt.
signs:
  - cmd: cosign
    signature: '${artifact}.sig'
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - '--output-signature=${signature}'
      - '--output-certificate=${certificate}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    output: true

changelog:
  sort: asc
  use: github
  groups:
    - title: New features
      regexp: '^feat'
      order: 0
    - title: Performance
      regexp: '^perf'
      order: 1
    - title: Bug fixes
      regexp: '^fix'
      order: 2
    - title: Test rigor
      regexp: '^test'
      order: 3
    - title: Refactors
      regexp: '^refactor'
      order: 4
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs'
      - '^ci'
      - '^chore'
      - '^build'
      - '^style'
      - 'Merge pull request'
      - 'Merge branch'

release:
  github:
    owner: thesm-os
    name: kanon
  draft: false
  prerelease: auto
  footer: |
    **Full changelog:** {{ .ReleaseURL }}

report_sizes: true
